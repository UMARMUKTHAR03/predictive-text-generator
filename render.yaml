services:
  # 1. Primary Technical Inference API (PyTorch BiLSTM 3.2M) - Operates safely at ~381 MB RSS on Render Free
  - type: web
    name: neurotext-ai-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      # Optional: set GENERAL_API_URL to point to the dedicated general inference microservice
      - key: GENERAL_API_URL
        value: ""
    plan: free
    autoDeploy: true

  # 2. Isolated General Inference Microservice (DistilGPT-2 82M)
  # IMPORTANT HOSTING REQUIREMENT:
  # Empirical testing confirms DistilGPT-2 reaches 714 MB peak RSS during generation.
  # It cannot be deployed on Render Free (512 MB hard cap) without triggering OOM SIGKILL (exit 137).
  # To deploy this service on Render, upgrade its plan to 'starter' (1 GB RAM, $7/month).
  # Or host it on a serverless inference endpoint (e.g., Modal, Hugging Face Inference API).
  # - type: web
  #   name: neurotext-ai-general
  #   runtime: python
  #   buildCommand: "pip install -r backend/requirements.txt"
  #   startCommand: "python -m uvicorn backend.app.general_main:app --host 0.0.0.0 --port $PORT"
  #   envVars:
